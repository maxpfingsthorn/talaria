name: ci
on: [push, pull_request, workflow_call, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run shellcheck bin/talaria
      - run: uv run ruff check .
      - run: uv run pytest -v
      - name: no deployment-specific values
        run: |
          ! grep -rnE '100\.[0-9]+\.[0-9]+\.[0-9]+|openclaw|@gmail\.com' \
              --include='*.md' --include='*.py' --include='*.container' \
              --include='*.service' --include='*.timer' \
              README.md AGENT_SETUP.md talaria helpers tools templates docs 2>/dev/null \
            | grep -v 'docs/superpowers/' \
            | grep -vE '100\.64\.0\.(0/10|1)([^0-9]|$)'
  e2e:
    # slow and creates users: the gate to main, releases and manual runs; PRs into develop skip it
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0      # the migration test installs v0.4.2 code (ca5e749)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # runner images set XDG_CONFIG_HOME=/home/runner/.config system-wide; every user
      # manager would inherit it and look for Quadlets in the runner's home
      - run: grep -n XDG /etc/environment || true; sudo sed -i '/^XDG_/d' /etc/environment
      - run: >-
          TALARIA_E2E=1 uv run pytest -m e2e -v -x tests/e2e/test_e2e.py
          tests/e2e/test_e2e_clawvisor.py tests/e2e/test_e2e_gbrain.py tests/e2e/test_e2e_hub.py
      - if: failure()
        run: |
          for u in talaria hermes cvtest gbtest hubadopt hermes2 hub2 hermes3; do
            id -u "$u" >/dev/null 2>&1 || continue
            echo "=== $u"; sudo journalctl --no-pager -n 200 _UID=$(id -u "$u") || true
            sudo -u "$u" -H ls -la "/home/$u/.local/state/talaria" || true
          done
          sudo -u talaria -H cat /home/talaria/.config/talaria/hub.conf || true
          sudo -u hermes -H cat /home/hermes/.config/containers/systemd/hermes.container || true
