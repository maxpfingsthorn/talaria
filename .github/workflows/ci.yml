name: ci
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run shellcheck bin/talaria
      - run: uv run pytest -v
      - name: no deployment-specific values
        run: |
          ! grep -rnE '100\.[0-9]+\.[0-9]+\.[0-9]+|openclaw|@gmail\.com' \
              --include='*.md' --include='*.py' --include='*.container' \
              --include='*.service' --include='*.timer' \
              README.md AGENTS.md talaria helpers templates docs 2>/dev/null \
            | grep -v 'docs/superpowers/'
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # runner images set XDG_CONFIG_HOME=/home/runner/.config system-wide; every user
      # manager would inherit it and look for Quadlets in the runner's home
      - run: grep -n XDG /etc/environment || true; sudo sed -i '/^XDG_/d' /etc/environment
      - run: TALARIA_E2E=1 uv run pytest -m e2e tests/e2e -v -x
      - if: failure()
        run: |
          sudo journalctl --no-pager -n 300 _UID=$(id -u hermes) || true
          sudo -u hermes -H ls -la /home/hermes/.local/state/talaria || true
          ls -la /usr/lib/systemd/user-generators/ /usr/libexec/podman/ || true
          sudo -u hermes -H cat /home/hermes/.config/containers/systemd/hermes.container || true
          cd / && sudo -u hermes -H env -i HOME=/home/hermes PATH=/usr/bin:/bin \
            /usr/libexec/podman/quadlet -dryrun -user -v 2>&1 | head -60 || true
