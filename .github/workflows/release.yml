name: release
# Every gate (unit, e2e, mutation, contract) runs on the release PR develop -> main. A tag push
# only verifies the owner's signature and publishes. This gate catches operator mistakes (an
# unsigned tag, the wrong commit, a missing version bump). It runs the tagged commit's own
# workflow and script, so it is no defence against a stolen write credential: the installs' own
# signature checks are.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch origin main
      - run: bash tools/verify-release-tag "$TAG"
        env:
          TAG: ${{ github.ref_name }}
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          git archive --prefix="talaria-$TAG/" -o "talaria-$TAG.tar.gz" "refs/tags/$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: talaria-${{ github.ref_name }}.tar.gz
      - run: gh release create "$TAG" --generate-notes --verify-tag "talaria-$TAG.tar.gz"
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
