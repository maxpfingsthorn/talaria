name: upstream
on:
  schedule: [{ cron: "17 5 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - run: TALARIA_CONTRACT=1 uv run pytest -m contract tests/contract -v
  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - run: uv run mutmut run && uv run mutmut export-cicd-stats
      - run: uv run python tests/mutation_score.py
  report:
    needs: [contract, mutation]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "Weekly upstream check failed" \
            --body "See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
