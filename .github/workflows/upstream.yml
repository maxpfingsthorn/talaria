name: upstream
on:
  schedule: [{ cron: "17 5 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      - run: TALARIA_CONTRACT=1 uv run pytest -m contract tests/contract -v
  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      - run: uv run mutmut run && uv run mutmut export-cicd-stats
      - run: uv run python tests/mutation_score.py
  report:
    needs: [contract, mutation]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "Weekly upstream check failed" \
            --body "See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
